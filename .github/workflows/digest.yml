name: daily-digest
on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
  workflow_dispatch:
concurrency:
  group: job-radar
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Optional link decoder (the radar works without it)
        run: pip install googlenewsdecoder || echo "link decoder not installed, news links stay as Google links"
      - name: Run
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py digest
      - name: Post report as GitHub issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f reports/latest.md ]; then
            gh issue create --title "📋 Job Radar report $(TZ=Asia/Kolkata date +'%d %b %Y')" --body-file reports/latest.md
          fi
      - name: Save state
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add state/ reports/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update state [skip ci]" && git pull --rebase && git push)
