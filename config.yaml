# ---------------------------------------------------------------
# Job Radar configuration. Edit this file, commit, push. No secrets here.
# Current setup: internships in INDIA for the 2028 graduating batch, favouring well-paying companies.
# ---------------------------------------------------------------

profile:
  # Title must contain one of these (internship / entry-level signal)
  include_keywords: [intern, interns, internship, trainee, "new grad", graduate, fresher, "entry level", "entry-level", apprentice, "early career"]
  # ...and one of these (tech role signal)
  role_keywords: [software, engineer, developer, sde, swe, "machine learning", ml, ai, "data scientist", "data science", backend, "back end", frontend, "full stack", fullstack, research, cloud, devops, security, python, java, "c++"]
  # Titles containing these are dropped
  exclude_keywords: [senior, sr, staff, principal, manager, director, lead, head, vp, "phd"]
  # Extra points in ranking
  priority_keywords: [ai, ml, "machine learning", "software engineer", sde, swe, backend, cloud, "data science"]
  skills: [python, "c++", java, "machine learning", ai, aws, tensorflow, pytorch, llm, fastapi, docker]
  target_year: 2027          # internship year you are aiming for
  graduation_year: 2028      # your batch. Postings that name other batches (e.g. "2026 graduates") are dropped.
  tech_only: true            # false = internships in every field

  # INDIA ONLY: location must name India or an Indian city. Plain "Remote" is NOT accepted.
  india_only: true
  locations: [india, bengaluru, bangalore, hyderabad, pune, gurgaon, gurugram, delhi, "new delhi", noida, mumbai, "navi mumbai", thane, chennai, kolkata, ahmedabad, kochi, jaipur, chandigarh, indore, coimbatore, trivandrum, thiruvananthapuram, lucknow, bhubaneswar, vadodara, nagpur, mysuru, mysore]

  # "GOOD PACKAGES". Most Indian internship posts do not publish pay, so two signals are combined:
  #   1. a stated stipend (when the posting lists one) must be at least min_stipend_inr_month
  #   2. companies on top_companies get a score boost (my guess at who pays well: edit freely)
  pay:
    min_stipend_inr_month: 40000
    only_known_good: false   # true = if pay is NOT stated, report only companies on top_companies
    top_companies: [google, microsoft, meta, apple, linkedin, hpe, amazon, atlassian, adobe, uber, stripe, databricks, nvidia, salesforce, "goldman sachs", "morgan stanley", jpmorgan, "american express", intuit, paypal, walmart, flipkart, phonepe, razorpay, cred, meesho, swiggy, zomato, "d e shaw", "de shaw", "tower research", graviton, "jane street", optiver, arcesium, rubrik, nutanix, oracle, sap, cisco, qualcomm, intel, "texas instruments", samsung, vmware, broadcom, servicenow, "palo alto networks", cloudflare, datadog, mongodb, coinbase, figma, openai, anthropic, postman, browserstack, thoughtspot, groww, paytm, airbnb, pinterest, twilio, okta, elastic, gitlab, lyft, asana, vercel, dropbox, duolingo, samsara, carta, webflow, notion, ramp, linear, replit, supabase, palantir, spotify]

alerts:
  digest_min_score: 4     # jobs below this are ignored completely
  instant_min_score: 6    # jobs at/above this trigger an immediate alert (a top company, good stated pay or a 2028 mention gets you there)

# Companies on public ATS boards (slug = the last part of their board URL).
#   boards.greenhouse.io/<slug>   jobs.lever.co/<slug>   jobs.ashbyhq.com/<slug>
# A wrong slug is harmless: it shows up under "Source problems" in the digest.
companies:
  greenhouse: [stripe, airbnb, databricks, cloudflare, datadog, mongodb, coinbase, figma, discord, robinhood, twilio, elastic, gitlab, okta, anthropic, reddit, pinterest, lyft, asana, vercel, scaleai, dropbox, duolingo, samsara, carta, webflow, postman, thoughtspot, browserstack]
  lever: [palantir, spotify, cred, meesho, paytm, groww]
  ashby: [openai, notion, ramp, linear, replit, supabase]

# InternScan: free, no key. Reads the official career portals of Google, Microsoft, Meta, NVIDIA, Qualcomm,
# Walmart and ~60 other India employers (the ones with no public API), refreshed by them every few hours.
# A job that leaves their feed is treated as closed. PhD roles are already dropped by exclude_keywords.
internscan:
  enabled: true
  url: https://internscan.vercel.app/in/api/active.json
  exclude_categories: ["Hardware/Silicon"]   # remove this line if you also want chip / ASIC roles

# Best source for India: Adzuna job search (free key at developer.adzuna.com).
# Needs ADZUNA_APP_ID / ADZUNA_APP_KEY secrets. Skipped silently until you add them.
adzuna:
  country: in
  max_days_old: 7
  queries: ["software engineer intern", "sde intern", "machine learning intern", "ai intern", "software intern 2028 batch", "summer intern 2027"]

# The Muse: free, no key. Lists internships from hundreds of companies.
themuse:
  enabled: true
  pages: 5

# Pages with no API (Google, Microsoft, a specific posting...). You get an alert when
# the status flips open <-> closed. JavaScript-heavy pages may be inconclusive.
watch_urls: []
#  - name: "Google SWE Intern 2027"
#    url: "https://www.google.com/about/careers/applications/jobs/results/?q=software%20engineering%20intern&target_level=INTERN_AND_APPRENTICE&location=India"
#    must_contain: ["intern"]          # open only if all of these appear on the page
#    closed_phrases: ["no results"]    # extra phrases that mean closed

# ---------------------------------------------------------------
# PROGRAMS: hackathons / hiring challenges you want to hear about the moment registrations open.
# Each is checked on every scan by (1) Google News headlines and (2) the official pages listed in urls.
#   must_match  - words the headline must contain          also_match - (optional) at least one of these too
#   urls        - official pages to watch (add the real registration page when it exists)
# ---------------------------------------------------------------
# After a program alerts once, stay quiet about it for this many days (no repeats for the same hiring).
program_cooldown_days: 30
programs:
  - name: "Google Girl Hackathon"
    news: '"Girl Hackathon" Google India'
    must_match: ["girl hackathon"]
    urls: ["https://goo.gle/GirlHackathon"]
  - name: "Flipkart GRiD"
    news: '"Flipkart GRiD"'
    must_match: ["grid"]
    urls: ["https://flipkartearlycareers.hirepro.in/"]
  - name: "Flipkart Girls Wanna Code"
    news: '"Girls Wanna Code" Flipkart'
    must_match: ["girls wanna code"]
    urls: []
  - name: "Uber HackTag"
    news: '"Uber HackTag"'
    must_match: ["hacktag"]
    urls: []
  - name: "Walmart CodeHers"
    news: '"CodeHers" Walmart'
    must_match: ["codehers"]
    urls: []
  - name: "Salesforce AI Challenge"
    news: 'Salesforce (hackathon OR challenge) students India'
    must_match: ["salesforce"]
    also_match: [hackathon, challenge, student, campus, fresher, intern, bootcamp]
    urls: []
