# ---------------------------------------------------------------
# Job Radar configuration. Edit this file, commit, push. No secrets here.
# Current setup: internships in INDIA for the 2028 graduating batch, favouring well-paying companies.
# ---------------------------------------------------------------

profile:
  # Title must contain one of these (internship / entry-level signal)
  include_keywords: [intern, interns, internship, "summer analyst", "summer associate"]   # internships only (not graduate programs)
  # ...and one of these (tech role signal)
  role_keywords: [software, engineer, engineering, developer, sde, swe, "machine learning", ml, ai, "data scientist", "data science", technology, technical, "information technology", backend, "back end", frontend, "full stack", fullstack, research, cloud, devops, security, python, java, "c++"]
  # Titles containing these are dropped
  exclude_keywords: [senior, sr, staff, principal, manager, director, lead, head, vp, "phd", hardware, silicon, asic, mechanical, civil, chemical, marketing, sales, graphics, motion, interaction, astronomy, events, finance, accounting, legal, recruiter, "human resources"]
  # Extra points in ranking
  priority_keywords: [ai, ml, "machine learning", "software engineer", "software engineering", sde, swe, backend, cloud, "data science"]
  skills: [python, "c++", java, "machine learning", ai, aws, tensorflow, pytorch, llm, fastapi, docker]
  target_year: 2027          # internship year you are aiming for
  graduation_year: 2028      # your batch. Postings that name other batches (e.g. "2026 graduates") are dropped.
  tech_only: true            # false = internships in every field

  # INDIA ONLY: location must name India or an Indian city. Plain "Remote" is NOT accepted.
  india_only: true
  locations: [india, bengaluru, bangalore, hyderabad, pune, gurgaon, gurugram, delhi, "new delhi", noida, mumbai, "navi mumbai", thane, chennai, kolkata, ahmedabad, kochi, jaipur, chandigarh, indore, coimbatore, trivandrum, thiruvananthapuram, lucknow, bhubaneswar, vadodara, nagpur, mysuru, mysore]

  # "GOOD PACKAGES". Most Indian internship posts do not publish pay, so two signals are combined:
  #   1. a stated stipend (when the posting lists one) must be at least min_stipend_inr_month
  #   2. companies on top_companies get a score boost (my guess at who pays well: edit freely)
  pay:
    min_stipend_inr_month: 40000
    only_known_good: false   # true = if pay is NOT stated, report only companies on top_companies
    # The best-paying employers: score +3 (top_companies get +2). Stipend blogs disagree, so this is rank, not a promise.
    elite_companies: [google, microsoft, amazon, atlassian, uber, "goldman sachs", "morgan stanley", "de shaw", "d e shaw", "tower research", arcesium, rubrik, databricks, nvidia, adobe, flipkart, "jane street", optiver, graviton, linkedin, salesforce, intuit, visa, stripe, openai, anthropic]
    top_companies: [google, microsoft, visa, mastercard, dell, meta, apple, linkedin, hpe, amazon, atlassian, adobe, uber, stripe, databricks, nvidia, salesforce, "goldman sachs", "morgan stanley", jpmorgan, "american express", intuit, paypal, walmart, flipkart, phonepe, razorpay, cred, meesho, swiggy, zomato, "d e shaw", "de shaw", "tower research", graviton, "jane street", optiver, arcesium, rubrik, nutanix, oracle, sap, cisco, qualcomm, intel, "texas instruments", samsung, vmware, broadcom, servicenow, "palo alto networks", cloudflare, datadog, mongodb, coinbase, figma, openai, anthropic, postman, browserstack, thoughtspot, groww, paytm, airbnb, pinterest, twilio, okta, elastic, gitlab, lyft, asana, vercel, dropbox, duolingo, samsara, carta, webflow, notion, ramp, linear, replit, supabase, palantir, spotify]

alerts:
  digest_min_score: 4     # jobs below this are ignored completely
  instant_min_score: 6    # jobs at/above this trigger an immediate alert (a top company, good stated pay or a 2028 mention gets you there)
  catchup_days: 7         # when you add a new source, postings from the last N days still alert once; older ones only go in the report
  gap_alert_hours: 3      # if no scan ran for this long, send a 'radar was paused' notice
  max_age_days: 14        # a posting older than this never triggers an instant alert and never counts as "new" in the report

# Companies on public ATS boards (slug = the last part of their board URL).
#   boards.greenhouse.io/<slug>   jobs.lever.co/<slug>   jobs.ashbyhq.com/<slug>
# A wrong slug is harmless: it shows up under "Source problems" in the digest.
companies:
  greenhouse: [rubrik, stripe, airbnb, databricks, cloudflare, datadog, mongodb, coinbase, figma, discord, robinhood, twilio, elastic, gitlab, okta, anthropic, reddit, pinterest, lyft, asana, vercel, scaleai, dropbox, duolingo, samsara, carta, webflow]
  lever: [palantir, spotify, cred, meesho, paytm]
  ashby: [openai, notion, ramp, linear, replit, supabase]
  # Workday employers (big companies run their careers sites on Workday). Each line is one careers site.
  # Add more: open the company's careers page, copy the address that contains ".myworkdayjobs.com", paste it as url.
  # Optional per line: search (default "intern"), pages (default 5 = 100 postings).
  # These addresses come from public job links; a wrong one shows up under "Source problems" in the daily report.
  # Removed after returning errors: Adobe university site, Dell, Walmart (Walmart is covered through InternScan).
  workday:
    - {url: "https://visa.wd5.myworkdayjobs.com/en-US/Visa_Talent_Portal", name: Visa}
    - {url: "https://visa.wd5.myworkdayjobs.com/en-US/Visa", name: Visa}
    - {url: "https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite", name: NVIDIA}
    - {url: "https://adobe.wd5.myworkdayjobs.com/external_experienced", name: Adobe}
    - {url: "https://salesforce.wd12.myworkdayjobs.com/External_Career_Site", name: Salesforce}
    - {url: "https://mastercard.wd1.myworkdayjobs.com/CorporateCareers", name: Mastercard}
    - {url: "https://mastercard.wd1.myworkdayjobs.com/Campus", name: Mastercard}
    - {url: "https://intel.wd1.myworkdayjobs.com/External", name: Intel}
    - {url: "https://hpe.wd5.myworkdayjobs.com/Jobsathpe", name: HPE}
    - {url: "https://paypal.wd1.myworkdayjobs.com/jobs", name: PayPal}
    - {url: "https://cisco.wd5.myworkdayjobs.com/Cisco_Careers", name: Cisco}

# InternScan: free, no key. Reads the official career portals of Google, Microsoft, Meta, NVIDIA, Qualcomm,
# Walmart and ~60 other India employers (the ones with no public API), refreshed by them every few hours.
# A job that leaves their feed is treated as closed. PhD roles are already dropped by exclude_keywords.
internscan:
  enabled: true
  url: https://internscan.vercel.app/in/api/active.json
  exclude_categories: ["Hardware/Silicon"]   # remove this line if you also want chip / ASIC roles

# Best source for India: Adzuna job search (free key at developer.adzuna.com).
# Needs ADZUNA_APP_ID / ADZUNA_APP_KEY secrets. Skipped silently until you add them.
adzuna:
  country: in
  max_days_old: 7
  queries: ["software engineer intern", "sde intern", "machine learning intern", "ai intern", "software intern 2028 batch", "summer intern 2027"]

# InternDoor: free RSS of new engineering internships / entry-level jobs in India, listed within minutes of going live.
# It reads employers on Workday, Oracle and Greenhouse (Visa, Amazon, Amex, Cisco...), so it fills gaps no single API can.
interndoor:
  enabled: true
  url: https://interndoor.com/feed.xml

# Amazon: reads amazon.jobs directly (their qualifications text is used to check the batch, e.g. "graduating in 2027").
amazon:
  enabled: true
  query: intern
  pages: 3

# The Muse: free, no key. Lists internships from hundreds of companies.
themuse:
  enabled: true
  pages: 5

# Pages with no API (Google, Microsoft, a specific posting...). You get an alert when
# the status flips open <-> closed. JavaScript-heavy pages may be inconclusive.
watch_urls: []
#  - name: "Google SWE Intern 2027"
#    url: "https://www.google.com/about/careers/applications/jobs/results/?q=software%20engineering%20intern&target_level=INTERN_AND_APPRENTICE&location=India"
#    must_contain: ["intern"]          # open only if all of these appear on the page
#    closed_phrases: ["no results"]    # extra phrases that mean closed

# ---------------------------------------------------------------
# PROGRAMS: hackathons / hiring challenges you want to hear about the moment registrations open.
# Each is checked on every scan by (1) Google News headlines and (2) the official pages listed in urls.
#   must_match  - words the headline must contain          also_match - (optional) at least one of these too
#   urls        - official pages to watch (add the real registration page when it exists)
# ---------------------------------------------------------------
# After a program alerts once, stay quiet about it for this many days (no repeats for the same hiring).
program_cooldown_days: 30
programs:
  - name: "Google Girl Hackathon"
    news: '"Girl Hackathon" Google India'
    must_match: ["girl hackathon"]
    urls: ["https://goo.gle/GirlHackathon"]
  - name: "Flipkart GRiD"
    news: '"Flipkart GRiD"'
    must_match: ["grid"]
    urls: ["https://flipkartearlycareers.hirepro.in/"]
  - name: "Flipkart Girls Wanna Code"
    news: '"Girls Wanna Code" Flipkart'
    must_match: ["girls wanna code"]
    urls: []
  - name: "Uber HackTag"
    news: '"Uber HackTag"'
    must_match: ["hacktag"]
    urls: []
  - name: "Walmart CodeHers"
    news: '"CodeHers" Walmart'
    must_match: ["codehers"]
    urls: []
  - name: "Salesforce AI Challenge"
    news: 'Salesforce (hackathon OR challenge) students India'
    must_match: ["salesforce"]
    also_match: [hackathon, challenge, student, campus, fresher, intern, bootcamp]
    urls: []
  - name: "Goldman Sachs Summer Analyst (India)"
    news: '"Goldman Sachs" summer analyst India 2027'
    must_match: ["goldman sachs"]
    also_match: ["summer analyst", "intern", "analyst program", "campus", "students"]
    urls: []
  - name: "Microsoft internships (India)"
    news: 'Microsoft internship India 2027 applications'
    must_match: ["microsoft"]
    also_match: ["intern", "explore microsoft", "engage"]
    urls: []
  - name: "Amazon internships and challenges (India)"
    news: 'Amazon internship India 2027 SDE intern OR "ML Challenge" OR HackOn'
    must_match: ["amazon"]
    also_match: ["intern", "sde", "wow", "ml challenge", "hackon"]
    urls: []
  - name: "Atlassian internship (India)"
    news: 'Atlassian internship India'
    must_match: ["atlassian"]
    also_match: ["intern"]
    urls: []
  - name: "Uber internship (India)"
    news: 'Uber internship India software engineering intern'
    must_match: ["uber"]
    also_match: ["intern"]
    urls: []
  - name: "JPMorgan Summer Analyst (India)"
    news: 'JPMorgan summer analyst India 2027'
    must_match: ["jpmorgan", "jp morgan"]
    also_match: ["intern", "summer analyst", "analyst program"]
    urls: []
  - name: "Morgan Stanley technology internship (India)"
    news: '"Morgan Stanley" technology summer analyst India 2027'
    must_match: ["morgan stanley"]
    also_match: ["intern", "summer analyst", "analyst program", "campus"]
    urls: []
  - name: "Walmart Sparkathon"
    news: 'Walmart Sparkathon'
    must_match: ["sparkathon"]
    urls: []
  - name: "Microsoft Engage"
    news: '"Microsoft Engage" 2027'
    must_match: ["microsoft engage"]
    urls: []
  - name: "Google Summer of Code"
    news: '"Google Summer of Code" 2027'
    must_match: ["summer of code", "gsoc"]
    urls: []

# ---------------------------------------------------------------
# OPPORTUNITY TRACKER: a hand-built map of well-paid internships for a 2028 graduate (3rd year) aiming at summer 2027.
# Shown in the daily report and in reports/opportunities.md. Edit freely.
#   now: true = check / apply now.   months = when it usually opens (1 = Jan).
#   confidence: confirmed = seen on a recent edition; reported = one website says so; typical = usual pattern, verify.
# Stipend blogs disagree wildly (roughly Rs 40k to 1.5 lakh a month for tier A), so no figures here.
# ---------------------------------------------------------------
opportunities:
  - {name: "Goldman Sachs Summer Analyst 2027 (India)", url: "https://higher.gs.com/", tier: A, batch: "2028 graduates", months: [7, 8, 9, 10, 11], now: true, confidence: reported, where: "Goldman Sachs careers (higher.gs.com)", note: "applications opened 1 Jul for the 2028 batch, rolling review: apply now if you have not"}
