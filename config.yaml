# ---------------------------------------------------------------
# DISCOVERY: the radar keeps searching the news for internships / hackathons / challenges you did NOT list,
# and alerts on each new one (one alert per story, links resolved, batch and deadline read from the article).
# A headline needs: an internship/hackathon/challenge word + an apply/open/register word + India/students/2027/2028
# + a tech word. Stories about batches other than yours are dropped.
# ---------------------------------------------------------------
discovery:
  enabled: true
  days: 2
  max_per_run: 5
  max_per_day: 12
  queries:
    - 'internship applications open India 2027 students'
    - 'summer internship 2027 India engineering students apply'
    - 'hackathon registrations open India engineering students 2027'
    - 'hiring challenge India 2028 batch'
    - 'off campus internship 2028 batch software'
    - 'pre-placement offer internship engineering students India 2027'
    - 'women engineers internship programme India 2027 apply'
    - 'coding challenge internship opportunity India students open now'
  exclude: [certificate, scam, fake, course, webinar, "free internship", "work from home", "paid course", fee]
